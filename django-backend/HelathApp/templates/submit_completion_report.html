<!DOCTYPE html>
<html>
<head>

<title>Submit Camp Completion Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Submit Camp Completion Report</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Total People Attended</label>

<input
type="number"
name="total_people"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Vaccinated People</label>

<input
type="number"
name="vaccinated_people"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Health Checkups</label>

<input
type="number"
name="health_checkups"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Medicines Distributed</label>

<input
type="number"
name="medicines_distributed"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Remarks</label>

<textarea
name="remarks"
class="form-control"
rows="5"></textarea>

</div>

<button
class="btn btn-success">

Submit Report

</button>

<a
href="{% url 'worker_campaigns' %}"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</body>

</html>
