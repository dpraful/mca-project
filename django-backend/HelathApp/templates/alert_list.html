<!DOCTYPE html>
<html>

<head>

<title>Health Alerts</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#eef3f8;">

<div class="container mt-5">

<div class="mb-3">
<a href="{% url 'adminhome' %}" class="btn btn-secondary btn-sm">
<i class="fa-solid fa-arrow-left"></i> Back
</a>
</div>

<div class="card shadow">

<div class="card-header bg-primary text-white d-flex justify-content-between">

<h3>Health Alerts</h3>

<a href="{% url 'add_alert' %}" class="btn btn-light">

Add Alert

</a>

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>

<th>ID</th>

<th>Title</th>

<th>Type</th>

<th>District</th>

<th>Status</th>

<th>Action</th>

</tr>

{% for i in alerts %}

<tr>

<td>{{ forloop.counter }}</td>

<td>{{ i.title }}</td>

<td>{{ i.alert_type }}</td>

<td>{{ i.district }}</td>

<td>{{ i.status }}</td>

<td>

<a href="{% url 'edit_alert' i.id %}" class="btn btn-warning btn-sm">

Edit

</a>

<a href="{% url 'delete_alert' i.id %}"

onclick="return confirm('Delete Alert?')"

class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</div>

</body>

</html>
