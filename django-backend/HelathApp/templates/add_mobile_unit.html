<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assign Mobile Healthcare Unit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #eef3f8;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .card-header {
            background: #0B3D91;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .form-control,
        .form-select {
            height: 45px;
        }

        textarea {
            height: 120px !important;
        }

        label {
            font-weight: 600;
        }

        .btn {
            min-width: 120px;
        }
    </style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header">

<i class="fa-solid fa-truck-medical"></i>

Assign Mobile Healthcare Unit

</div>

<div class="card-body">

<form method="POST" onsubmit="return validateForm()">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">

<label>Vehicle Number</label>

<input type="text"
       id="vehicle_no"
       name="vehicle_no"
       class="form-control"
       placeholder="KL-08-AB-1234"
       required>
<span class="text-danger small" id="vehicleError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Driver Name</label>

<input type="text"
       id="driver_name"
       name="driver_name"
       class="form-control"
       required>
<span class="text-danger small" id="driverError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Assign Field Worker</label>

<select id="field_worker"
        name="field_worker"
        class="form-select"
        required>

<option value="">Select Worker</option>

{% for worker in workers %}

<option value="{{ worker.id }}">

{{ worker.full_name }}

</option>

{% endfor %}

</select>
<span class="text-danger small" id="workerError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Assign Region</label>

<select id="region"
        name="region"
        class="form-select"
        required>

<option value="">Select Region</option>

{% for region in regions %}

<option value="{{ region.id }}">

{{ region.region_name }}

</option>

{% endfor %}

</select>
<span class="text-danger small" id="regionError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Assigned Date</label>

<input type="date"
       id="assigned_date"
       name="assigned_date"
       class="form-control"
       required>
<span class="text-danger small" id="dateError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Status</label>

<input type="text"
       class="form-control"
       value="Assigned"
       readonly>

</div>

<div class="col-md-12 mb-3">

<label>Remarks</label>

<textarea
name="remarks"
class="form-control"
placeholder="Enter remarks if any..."></textarea>

</div>

<div class="text-center">

<button type="submit"
        class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Assign

</button>

<a href="{% url 'mobile_unit_list' %}"

class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script>

// Set today as the minimum date for Assigned Date (no past dates)
(function setMinDate(){
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("assigned_date").min = today;
})();

function validateForm(){

    let valid = true;

    // Clear all errors
    document.querySelectorAll(".text-danger").forEach(function(e){ e.innerHTML = ""; });


    // Vehicle Number — Kerala format: KL-XX-AB-1234
    let vehicleNo = document.getElementById("vehicle_no").value.trim().toUpperCase();
    if(!/^[A-Z]{2}-\d{2}-[A-Z]{2}-\d{4}$/.test(vehicleNo)){
        document.getElementById("vehicleError").innerHTML = "Format must be KL-08-AB-1234";
        valid = false;
    }


    // Driver Name — letters and spaces only, 3–50 chars
    let driverName = document.getElementById("driver_name").value.trim();
    if(!/^[A-Za-z ]{3,50}$/.test(driverName)){
        document.getElementById("driverError").innerHTML = "Enter a valid driver name (letters only, 3–50 chars)";
        valid = false;
    }


    // Field Worker — must select
    if(document.getElementById("field_worker").value === ""){
        document.getElementById("workerError").innerHTML = "Please select a field worker";
        valid = false;
    }


    // Region — must select
    if(document.getElementById("region").value === ""){
        document.getElementById("regionError").innerHTML = "Please select a region";
        valid = false;
    }


    // Assigned Date — must not be a past date
    let assignedDate = document.getElementById("assigned_date").value;
    if(!assignedDate){
        document.getElementById("dateError").innerHTML = "Assigned date is required";
        valid = false;
    } else {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const selected = new Date(assignedDate);
        if(selected < today){
            document.getElementById("dateError").innerHTML = "Assigned date cannot be a past date";
            valid = false;
        }
    }


    return valid;

}

</script>

</body>

</html>
