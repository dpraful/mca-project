<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Disease</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#eef3f8;
}

.card{
    border:none;
    border-radius:15px;
}

.card-header{
    background:#0B3D91;
    color:white;
    font-size:22px;
    font-weight:bold;
}

textarea{
    height:120px !important;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow">

<div class="card-header">

<i class="fa-solid fa-virus"></i>

Edit Disease

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Disease Name</label>

<input
type="text"
name="disease_name"
class="form-control"
value="{{ disease.disease_name }}"
required>

</div>

<div class="mb-3">

<label>Disease Type</label>

<input
type="text"
name="disease_type"
class="form-control"
value="{{ disease.disease_type }}"
required>

</div>

<div class="mb-3">

<label>Severity Level</label>

<select
name="severity_level"
class="form-select"
required>

<option value="Low" {% if disease.severity_level == "Low" %}selected{% endif %}>Low</option>

<option value="Medium" {% if disease.severity_level == "Medium" %}selected{% endif %}>Medium</option>

<option value="High" {% if disease.severity_level == "High" %}selected{% endif %}>High</option>

</select>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
name="description"
class="form-control"
required>{{ disease.description }}</textarea>

</div>
<div class="mb-3">

<label>Precautions</label>

<textarea
name="precautions"
class="form-control"
required>{{ disease.precautions }}</textarea>

</div>

</div>

<div class="text-center">

<button class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Update

</button>

<a href="{% url 'disease_list' %}" class="btn btn-secondary">

Back

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
