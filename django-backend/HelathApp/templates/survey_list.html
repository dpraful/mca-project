<!DOCTYPE html>
<html>

<head>

<title>Survey List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<a href="{% url 'add_survey' %}" class="btn btn-primary mb-3">
Add Survey
</a>

<table class="table table-bordered table-hover">

<tr>

<th>Date</th>

<th>Region</th>

<th>Total Houses</th>

<th>Population</th>

<th>Actions</th>

</tr>

{% for i in surveys %}

<tr>

<td>{{i.survey_date}}</td>

<td>{{i.region.region_name}}</td>

<td>{{i.total_houses}}</td>

<td>{{i.total_population}}</td>

<td>

<a href="{% url 'edit_survey' i.id %}" class="btn btn-warning btn-sm">
Edit
</a>

<a href="{% url 'delete_survey' i.id %}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete?')">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
