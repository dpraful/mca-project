<!DOCTYPE html>
<html>
<head>
    <title>Edit Vaccination Campaign</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#eef3f8;}
        .card{border:none;border-radius:15px;}
        .card-header{background:#0B3D91;color:white;font-size:24px;font-weight:bold;}
        .form-control,.form-select{height:45px;}
        textarea.form-control{height:120px !important;}
        label{font-weight:600;}
        .btn{min-width:120px;}
    </style>
</head>
<body>

<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-lg-9">

<div class="card shadow">

<div class="card-header">
<i class="fa-solid fa-pen-to-square"></i>
Edit Vaccination / Health Camp
</div>

<div class="card-body">

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-warning">{{ message }}</div>
    {% endfor %}
{% endif %}

<form method="POST" onsubmit="return validateForm()">
{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">
<label>Camp Name</label>
<input type="text" id="camp_name" name="camp_name" value="{{ campaign.camp_name }}" class="form-control" required>
<span class="text-danger small" id="campNameError"></span>
</div>

<div class="col-md-6 mb-3">
<label>Camp Date</label>
<input type="date" id="camp_date" name="camp_date" value="{{ campaign.camp_date|date:'Y-m-d' }}" class="form-control" required>
<span class="text-danger small" id="campDateError"></span>
</div>

<div class="col-md-6 mb-3">
<label>Camp Time</label>
<input type="time" id="camp_time" name="camp_time" value="{{ campaign.camp_time|time:'H:i' }}" class="form-control" required>
<span class="text-danger small" id="campTimeError"></span>
</div>

<div class="col-md-6 mb-3">
<label>Venue</label>
<input type="text" id="venue" name="venue" value="{{ campaign.venue }}" class="form-control" required>
<span class="text-danger small" id="venueError"></span>
</div>

<div class="col-md-6 mb-3">
<label>Target Population</label>
<input type="number" id="target_population" name="target_population" value="{{ campaign.target_population }}" class="form-control" min="1" required>
<span class="text-danger small" id="targetError"></span>
</div>

<div class="col-md-6 mb-3">
<label>Status</label>
<select id="status" name="status" class="form-select" required>
    <option value="Scheduled" {% if campaign.status == 'Scheduled' %}selected{% endif %}>Scheduled</option>
    <option value="Ongoing" {% if campaign.status == 'Ongoing' %}selected{% endif %}>Ongoing</option>
    <option value="Completed" {% if campaign.status == 'Completed' %}selected{% endif %}>Completed</option>
    <option value="Cancelled" {% if campaign.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
</select>
</div>

<div class="col-md-12 mb-3">
<label>Description</label>
<textarea id="description" name="description" class="form-control" rows="4" required>{{ campaign.description }}</textarea>
<span class="text-danger small" id="descError"></span>
</div>

<div class="text-center mt-3">
<button type="submit" class="btn btn-success">
<i class="fa-solid fa-floppy-disk"></i> Update Campaign
</button>
<a href="{% url 'campaign_list' %}" class="btn btn-secondary">
<i class="fa-solid fa-arrow-left"></i> Back
</a>
</div>

</div>
</form>

</div>
</div>
</div>
</div>
</div>

<script>

// Prevent past dates for Camp Date
(function setMinDate(){
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("camp_date").min = today;
})();

function validateForm(){

    let valid = true;

    // Clear all errors
    document.querySelectorAll(".text-danger").forEach(function(e){ e.innerHTML = ""; });


    // Camp Name — min 3 chars
    let campName = document.getElementById("camp_name").value.trim();
    if(campName.length < 3){
        document.getElementById("campNameError").innerHTML = "Camp name must be at least 3 characters";
        valid = false;
    }


    // Camp Date — required, must not be past
    let campDate = document.getElementById("camp_date").value;
    if(!campDate){
        document.getElementById("campDateError").innerHTML = "Camp date is required";
        valid = false;
    } else {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const selected = new Date(campDate);
        if(selected < today){
            document.getElementById("campDateError").innerHTML = "Camp date cannot be a past date";
            valid = false;
        }
    }


    // Camp Time — required
    if(document.getElementById("camp_time").value === ""){
        document.getElementById("campTimeError").innerHTML = "Camp time is required";
        valid = false;
    }


    // Venue — min 3 chars
    let venue = document.getElementById("venue").value.trim();
    if(venue.length < 3){
        document.getElementById("venueError").innerHTML = "Enter a valid venue (min 3 characters)";
        valid = false;
    }


    // Target Population — at least 1
    let target = parseInt(document.getElementById("target_population").value);
    if(isNaN(target) || target < 1){
        document.getElementById("targetError").innerHTML = "Target population must be at least 1";
        valid = false;
    }


    // Description — min 10 chars
    let desc = document.getElementById("description").value.trim();
    if(desc.length < 10){
        document.getElementById("descError").innerHTML = "Description must be at least 10 characters";
        valid = false;
    }


    return valid;

}

</script>

</body>
</html>
