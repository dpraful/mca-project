<!DOCTYPE html>
<html>
<head>
<title>Add Survey</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="mb-3">
<a href="{% url 'worker_home' %}" class="btn btn-secondary btn-sm">
<i class="fa-solid fa-arrow-left"></i> Back
</a>
</div>

<h2 class="mb-4">Add Survey</h2>

<form method="post">

{% csrf_token %}

<div class="row">

    <div class="col-md-6 mb-3">
        <label>Region</label>
        <select name="region" class="form-control" required>
            {% for i in regions %}
            <option value="{{ i.id }}">{{ i.region_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-6 mb-3">
        <label>Survey Date</label>
        <input type="date" name="survey_date" class="form-control" required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Total Houses</label>
        <input type="number" name="total_houses" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Houses Visited</label>
        <input type="number" name="houses_visited" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Total Population</label>
        <input type="number" name="total_population" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Male Population</label>
        <input type="number" name="male_population" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Female Population</label>
        <input type="number" name="female_population" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Children</label>
        <input type="number" name="children" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Senior Citizens</label>
        <input type="number" name="senior_citizens" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Pregnant Women</label>
        <input type="number" name="pregnant_women" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Disabled People</label>
        <input type="number" name="disabled_people" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Vaccinated People</label>
        <input type="number" name="vaccinated_people" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Unvaccinated People</label>
        <input type="number" name="unvaccinated_people" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Chronic Patients</label>
        <input type="number" name="chronic_patients" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Fever Cases</label>
        <input type="number" name="fever_cases" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Suspected Dengue</label>
        <input type="number" name="suspected_dengue" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Suspected Malaria</label>
        <input type="number" name="suspected_malaria" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Water Sources Checked</label>
        <input type="number" name="water_sources_checked" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Unsafe Water Sources</label>
        <input type="number" name="unsafe_water_sources" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Sanitation Issues</label>
        <input type="number" name="sanitation_issues" class="form-control" value="0">
    </div>

    <div class="col-md-4 mb-3">
        <label>Awareness Programs</label>
        <input type="number" name="awareness_programs" class="form-control" value="0">
    </div>

    <div class="col-md-12 mb-3">
        <label>Remarks</label>
        <textarea name="remarks" class="form-control" rows="4"></textarea>
    </div>

</div>

<br>

<button class="btn btn-success">
Save Survey
</button>

</form>

</div>

</body>
</html>
