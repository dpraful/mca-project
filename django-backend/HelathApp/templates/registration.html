{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>User Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

background:linear-gradient(135deg,#4facfe,#00f2fe);

min-height:100vh;

font-family:Arial,Helvetica,sans-serif;

padding:30px;

}

.card{

max-width:900px;

margin:auto;

border:none;

border-radius:20px;

box-shadow:0px 15px 35px rgba(0,0,0,.25);

overflow:hidden;

}

.card-header{

background:#0d6efd;

color:white;

padding:20px;

text-align:center;

}

.card-body{

padding:35px;

}

.form-label{

font-weight:bold;

}

.form-control,

.form-select{

border-radius:10px;

height:48px;

}

textarea.form-control{

height:100px;

}

.error{

color:red;

font-size:13px;

}

.preview{

width:130px;

height:130px;

border-radius:50%;

object-fit:cover;

border:3px solid #ddd;

display:none;

margin:auto;

margin-bottom:15px;

}

.password-box{

position:relative;

}

.password-box i{

position:absolute;

right:15px;

top:15px;

cursor:pointer;

}

.btn-register{

background:#0d6efd;

color:white;

font-size:18px;

padding:12px;

border-radius:10px;

}

.btn-register:hover{

background:#0b5ed7;

}

.location-btn{

margin-top:10px;

}

@media(max-width:768px){

.card-body{

padding:20px;

}

}

</style>

</head>

<body>

<div style="padding:15px 30px;">
<a href="{% url 'index' %}" class="btn btn-secondary btn-sm">
<i class="fa-solid fa-arrow-left"></i> Back
</a>
</div>

<div class="card">

<div class="card-header">

<h2>User Registration</h2>

</div>

<div class="card-body">

{% if messages %}

{% for message in messages %}

<div class="alert alert-success alert-dismissible fade show">

{{message}}

<button class="btn-close" data-bs-dismiss="alert"></button>

</div>

{% endfor %}

{% endif %}

<form method="POST"

enctype="multipart/form-data"

onsubmit="return validateForm()">

{% csrf_token %}

<div class="text-center">

<img id="preview" class="preview">

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Name

</label>

<input

type="text"

class="form-control"

id="name"

name="name"

required>

<span id="nameError" class="error"></span>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Age

</label>

<input

type="number"

class="form-control"

id="age"

name="age"

required>

<span id="ageError" class="error"></span>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Gender

</label>

<select

class="form-select"

name="gender"

required>

<option value="">

Select Gender

</option>

<option value="m">

Male

</option>

<option value="f">

Female

</option>

<option value="o">

Other

</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Email

</label>

<input

type="email"

class="form-control"

id="email"

name="email"

required>

<span id="emailError" class="error"></span>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Phone

</label>

<input

type="text"

class="form-control"

id="phone"

name="phone"

maxlength="10"

required>

<span id="phoneError" class="error"></span>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Password

</label>

<div class="password-box">

<input

type="password"

class="form-control"

id="password"

name="password"

required>

<i

class="fa-solid fa-eye"

onclick="togglePassword()">

</i>

</div>

<span id="passError" class="error"></span>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Profile Image

</label>

<input

type="file"

class="form-control"

id="image"

name="image"

accept="image/*"

onchange="previewImage(event)">

<span id="imageError" class="error"></span>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Date of Birth

</label>

<input

type="date"

class="form-control"

id="dob"

name="dob"

required>

</div>

<div class="col-12 mb-3">

<label class="form-label">

Address

</label>

<textarea

class="form-control"

name="address"

required>

</textarea>

</div>
<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
District
</label>

<select
class="form-select"
name="district"
required>

<option value="">
Select District
</option>

<option value="Thiruvananthapuram">Thiruvananthapuram</option>
<option value="Kollam">Kollam</option>
<option value="Pathanamthitta">Pathanamthitta</option>
<option value="Alappuzha">Alappuzha</option>
<option value="Kottayam">Kottayam</option>
<option value="Idukki">Idukki</option>
<option value="Ernakulam">Ernakulam</option>
<option value="Thrissur">Thrissur</option>
<option value="Palakkad">Palakkad</option>
<option value="Malappuram">Malappuram</option>
<option value="Kozhikode">Kozhikode</option>
<option value="Wayanad">Wayanad</option>
<option value="Kannur">Kannur</option>
<option value="Kasaragod">Kasaragod</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
State
</label>

<select
class="form-select"
name="state"
required>

<option value="">
Select State
</option>

<option value="Kerala">
Kerala
</option>

<option value="Tamil Nadu">
Tamil Nadu
</option>

<option value="Karnataka">
Karnataka
</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Pincode
</label>

<input
type="text"
class="form-control"
id="pincode"
name="pincode"
maxlength="6"
required>

<span
class="error"
id="pinError">
</span>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Blood Group
</label>

<select
class="form-select"
name="blood_group"
required>

<option value="">
Select Blood Group
</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Emergency Contact
</label>

<input
type="text"
class="form-control"
id="emergency"
name="emergency_contact"
maxlength="10"
required>

<span
class="error"
id="emergencyError">
</span>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Latitude
</label>

<input
type="text"
class="form-control"
id="latitude"
name="latitude"
placeholder="e.g. 10.52194"
>
<span class="error" id="latError"></span>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Longitude
</label>

<input
type="text"
class="form-control"
id="longitude"
name="longitude"
placeholder="e.g. 76.21456"
>
<span class="error" id="lonError"></span>

</div>

<div class="col-md-6 mb-3 d-grid">

{% comment %} <button
type="button"
class="btn btn-success location-btn"
onclick="getLocation()">

<i class="fa-solid fa-location-crosshairs"></i>

Get Current Location

</button> {% endcomment %}

</div>

<div class="col-md-6 mb-3">

<div
id="locationStatus"
style="margin-top:12px;color:green;font-weight:bold;">
</div>

</div>

</div>

<hr>

<button
type="submit"
class="btn btn-register w-100">

<i class="fa-solid fa-user-plus"></i>

Register

</button>

<div class="text-center mt-4">

Already have an account?

<a href="{% url 'login' %}">
Login
</a>

</div>

</form>

</div>

</div>

<script>

// ---------------- Image Preview ----------------

function previewImage(event){

    const preview=document.getElementById("preview");

    preview.src=URL.createObjectURL(event.target.files[0]);

    preview.style.display="block";

}


// ---------------- Set DOB min/max on page load ----------------

(function setDobLimits(){

    const dob = document.getElementById("dob");

    const today = new Date();

    // max = 18 years ago (must be at least 18)
    const maxDate = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());

    // min = 100 years ago
    const minDate = new Date(today.getFullYear() - 100, today.getMonth(), today.getDate());

    dob.max = maxDate.toISOString().split("T")[0];
    dob.min = minDate.toISOString().split("T")[0];

})();


// ---------------- Password Show / Hide ----------------

function togglePassword(){

    let pass=document.getElementById("password");

    let icon=document.querySelector(".password-box i");

    if(pass.type==="password"){

        pass.type="text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    }

    else{

        pass.type="password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}


// ---------------- Browser Location ----------------

function getLocation(){

    if(navigator.geolocation){

        document.getElementById("locationStatus").innerHTML="Getting location...";

        navigator.geolocation.getCurrentPosition(showPosition,errorPosition);

    }

    else{

        alert("Geolocation not supported.");

    }

}


function showPosition(position){

    document.getElementById("latitude").value=position.coords.latitude;

    document.getElementById("longitude").value=position.coords.longitude;

    document.getElementById("locationStatus").innerHTML="Location captured successfully.";

}


function errorPosition(){

    document.getElementById("locationStatus").style.color="red";

    document.getElementById("locationStatus").innerHTML="Unable to fetch location.";

}



// ---------------- Form Validation ----------------

function validateForm(){

    let valid=true;

    document.querySelectorAll(".error").forEach(function(e){

        e.innerHTML="";

    });


    // Name

    let name=document.getElementById("name").value.trim();

    if(!/^[A-Za-z ]{3,50}$/.test(name)){

        document.getElementById("nameError").innerHTML="Enter valid name";

        valid=false;

    }


    // Age

    let age=parseInt(document.getElementById("age").value);

    if(age<18 || age>100){

        document.getElementById("ageError").innerHTML="Age must be between 18 and 100";

        valid=false;

    }


    // Email

    let email=document.getElementById("email").value;

    let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailPattern.test(email)){

        document.getElementById("emailError").innerHTML="Invalid email";

        valid=false;

    }


    // Phone

    let phone=document.getElementById("phone").value;

    if(!/^[6-9][0-9]{9}$/.test(phone)){

        document.getElementById("phoneError").innerHTML="Enter valid mobile number";

        valid=false;

    }


    // Password

    let password=document.getElementById("password").value;

    let passPattern=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

    if(!passPattern.test(password)){

        document.getElementById("passError").innerHTML="Minimum 8 characters, uppercase, lowercase, number & special character";

        valid=false;

    }


    // Pincode

    let pin=document.getElementById("pincode").value;

    if(!/^[1-9][0-9]{5}$/.test(pin)){

        document.getElementById("pinError").innerHTML="Invalid pincode";

        valid=false;

    }


    // Emergency Contact

    let emergency=document.getElementById("emergency").value;

    if(!/^[6-9][0-9]{9}$/.test(emergency)){

        document.getElementById("emergencyError").innerHTML="Invalid emergency contact";

        valid=false;

    }


    // Image Validation

    let image=document.getElementById("image").files[0];

    if(image){

        let allowed=["image/jpeg","image/png","image/jpg"];

        if(!allowed.includes(image.type)){

            document.getElementById("imageError").innerHTML="Only JPG and PNG images allowed";

            valid=false;

        }

        if(image.size>2*1024*1024){

            document.getElementById("imageError").innerHTML="Image size should be below 2 MB";

            valid=false;

        }

    }


    // Latitude
    let lat = document.getElementById("latitude").value.trim();
    let latPattern = /^-?([1-8]?\d(\.\d+)?|90(\.0+)?)$/;
    if(lat === ""){
        document.getElementById("latError").innerHTML = "Latitude is required (e.g. 10.52194)";
        valid = false;
    } else if(!latPattern.test(lat)){
        document.getElementById("latError").innerHTML = "Invalid latitude. Use format like 10.52194 (between -90 and 90)";
        valid = false;
    }

    // Longitude
    let lon = document.getElementById("longitude").value.trim();
    let lonPattern = /^-?(180(\.0+)?|1[0-7]\d(\.\d+)?|[1-9]\d(\.\d+)?|0(\.\d+)?)$/;
    if(lon === ""){
        document.getElementById("lonError").innerHTML = "Longitude is required (e.g. 76.21456)";
        valid = false;
    } else if(!lonPattern.test(lon)){
        document.getElementById("lonError").innerHTML = "Invalid longitude. Use format like 76.21456 (between -180 and 180)";
        valid = false;
    }

    return valid;

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
