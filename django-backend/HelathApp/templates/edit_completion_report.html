<!DOCTYPE html>
<html>
<head>

<title>Edit Completion Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Completion Report</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Total People</label>

<input
type="number"
name="total_people"
value="{{ report.total_people }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Vaccinated People</label>

<input
type="number"
name="vaccinated_people"
value="{{ report.vaccinated_people }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Health Checkups</label>

<input
type="number"
name="health_checkups"
value="{{ report.health_checkups }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Medicines Distributed</label>

<input
type="number"
name="medicines_distributed"
value="{{ report.medicines_distributed }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Remarks</label>

<textarea
name="remarks"
rows="5"
class="form-control">{{ report.remarks }}</textarea>

</div>

<button class="btn btn-warning">

Update Report

</button>

<a
href="{% url 'my_completion_reports' %}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
