<!DOCTYPE html>
<html>

<head>

<title>Update Hospital Resources</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#eef3f8;
}

.card{
    border:none;
    border-radius:15px;
}

.card-header{
    font-size:22px;
    font-weight:bold;
}

.form-control,
.form-select{
    height:45px;
}

.btn{
    min-width:120px;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-7">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<i class="fa-solid fa-hospital"></i>

Update Hospital Resources

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Total Beds

</label>

<input
type="number"
name="total_beds"
class="form-control"
value="{{ hospital.total_beds }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

ICU Beds

</label>

<input
type="number"
name="icu_beds"
class="form-control"
value="{{ hospital.icu_beds }}"
required>

</div>

<div class="mb-4">

<label class="form-label">

Ambulance Availability

</label>

<select
name="ambulance"
class="form-select">

<option value="True"
{% if hospital.ambulance %}
selected
{% endif %}>
Available
</option>

<option value="False"
{% if not hospital.ambulance %}
selected
{% endif %}>
Not Available
</option>

</select>

</div>

<div class="text-center">

<button
type="submit"
class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Update

</button>

<a href="{% url 'hospital_home' %}"
class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
