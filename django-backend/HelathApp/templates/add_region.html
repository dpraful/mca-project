<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add Region</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#eef3f8;
}

.card{
    border:none;
    border-radius:15px;
}

.card-header{
    background:#0B3D91;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.form-control,
.form-select{
    height:48px;
}

.btn{
    min-width:130px;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-7">

<div class="card shadow">

<div class="card-header">

<i class="fa-solid fa-map-location-dot"></i>

Add New Region

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Region Name

</label>

<input
type="text"
name="region_name"
class="form-control"
placeholder="Enter Region Name"
required>

</div>

<div class="mb-3">

<label class="form-label">

Region Type

</label>

<select
name="region_type"
class="form-select">

<option value="">Select Region Type</option>

<option value="Urban">Urban</option>

<option value="Rural">Rural</option>

<option value="Tribal">Tribal</option>

</select>

</div>

<div class="row">

<div class="col-md-6">

<div class="mb-3">

<label>Latitude</label>

<input
type="text"
name="latitude"
class="form-control"
placeholder="Latitude">

</div>

</div>

<div class="col-md-6">

<div class="mb-3">

<label>Longitude</label>

<input
type="text"
name="longitude"
class="form-control"
placeholder="Longitude">

</div>

</div>

</div>

<div class="text-center">

<button class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Save

</button>

<a href="{% url 'region_list' %}" class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
