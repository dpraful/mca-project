<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Disease Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#f4f8fb;
}

.card{
    margin-top:60px;
    border-radius:15px;
}

h2{
    color:#0d6efd;
}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center mb-4">

<i class="fa-solid fa-heart-pulse"></i>

Disease Prediction (ARIMA)

</h2>

{% if messages %}

{% for message in messages %}

<div class="alert alert-danger">

{{ message }}

</div>

{% endfor %}

{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Disease

</label>

<select
class="form-select"
name="disease"
required>

<option value="">

Select Disease

</option>

{% for d in diseases %}

<option value="{{ d.id }}">

{{ d.disease_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>

Region

</label>

<select
class="form-select"
name="region"
required>

<option>

Select Region

</option>

{% for r in regions %}

<option value="{{ r.id }}">

{{ r.region_name }}

</option>

{% endfor %}

</select>

</div>

<div class="text-center">

<button
class="btn btn-primary btn-lg">

<i class="fa-solid fa-chart-line"></i>

Predict

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
