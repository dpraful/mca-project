<!DOCTYPE html>
<html>

<head>

<title>Edit Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef3f8;
}

.card{
border:none;
border-radius:15px;
}

.card-header{
background:#0B3D91;
color:white;
font-size:24px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header">

Edit Profile

</div>

<div class="card-body">

<form method="POST" onsubmit="return validateForm()">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input
type="text"
id="full_name"
name="full_name"
class="form-control"
value="{{ worker.full_name }}"
required>
<span class="text-danger small" id="fullNameError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Phone</label>

<input
type="text"
id="phone"
name="phone"
class="form-control"
value="{{ worker.phone }}"
required
maxlength="10">
<span class="text-danger small" id="phoneError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
id="email"
name="email"
class="form-control"
value="{{ worker.email }}"
required>
<span class="text-danger small" id="emailError"></span>

</div>

<div class="col-md-6 mb-3">

<label>District</label>

<input
type="text"
id="district"
name="district"
class="form-control"
value="{{ worker.district }}"
required>
<span class="text-danger small" id="districtError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Panchayat</label>

<input
type="text"
id="panchayat"
name="panchayat"
class="form-control"
value="{{ worker.panchayat }}"
required>
<span class="text-danger small" id="panchayatError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Ward</label>

<input
type="number"
id="ward"
name="ward"
class="form-control"
value="{{ worker.ward }}"
required
min="1">
<span class="text-danger small" id="wardError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Qualification</label>

<input
type="text"
id="qualification"
name="qualification"
class="form-control"
value="{{ worker.qualification }}"
required>
<span class="text-danger small" id="qualError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Experience</label>

<input
type="number"
id="experience"
name="experience"
class="form-control"
value="{{ worker.experience }}"
required
min="0"
max="40">
<span class="text-danger small" id="expError"></span>

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea
id="address"
name="address"
class="form-control"
rows="4" required>{{ worker.address }}</textarea>
<span class="text-danger small" id="addressError"></span>

</div>

<div class="text-center">

<button
class="btn btn-success">

Update Profile

</button>

<a href="{% url 'worker_profile' %}"

class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script>

function validateForm(){

    let valid = true;

    // Clear all errors
    document.querySelectorAll(".text-danger").forEach(function(e){ e.innerHTML = ""; });


    // Full Name — letters and spaces, 3–50 chars
    let fullName = document.getElementById("full_name").value.trim();
    if(!/^[A-Za-z ]{3,50}$/.test(fullName)){
        document.getElementById("fullNameError").innerHTML = "Enter a valid name (3–50 letters only)";
        valid = false;
    }


    // Phone — Indian mobile: starts with 6-9, exactly 10 digits
    let phone = document.getElementById("phone").value.trim();
    if(!/^[6-9][0-9]{9}$/.test(phone)){
        document.getElementById("phoneError").innerHTML = "Enter a valid 10-digit mobile number";
        valid = false;
    }


    // Email
    let email = document.getElementById("email").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        document.getElementById("emailError").innerHTML = "Enter a valid email address";
        valid = false;
    }


    // District — min 3 chars
    let district = document.getElementById("district").value.trim();
    if(district.length < 3){
        document.getElementById("districtError").innerHTML = "Enter a valid district name";
        valid = false;
    }


    // Panchayat — min 3 chars
    let panchayat = document.getElementById("panchayat").value.trim();
    if(panchayat.length < 3){
        document.getElementById("panchayatError").innerHTML = "Enter a valid panchayat name";
        valid = false;
    }


    // Ward — positive integer
    let ward = parseInt(document.getElementById("ward").value);
    if(isNaN(ward) || ward < 1){
        document.getElementById("wardError").innerHTML = "Ward number must be at least 1";
        valid = false;
    }


    // Qualification — min 3 chars
    let qual = document.getElementById("qualification").value.trim();
    if(qual.length < 3){
        document.getElementById("qualError").innerHTML = "Enter a valid qualification";
        valid = false;
    }


    // Experience — 0 to 40 years
    let exp = parseInt(document.getElementById("experience").value);
    if(isNaN(exp) || exp < 0 || exp > 40){
        document.getElementById("expError").innerHTML = "Experience must be between 0 and 40 years";
        valid = false;
    }


    // Address — min 5 chars
    let address = document.getElementById("address").value.trim();
    if(address.length < 5){
        document.getElementById("addressError").innerHTML = "Please enter a valid address";
        valid = false;
    }


    return valid;

}

</script>

</body>

</html>
