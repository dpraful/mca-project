<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Field Worker Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#eef3f8;
}

.card{
    border:none;
    border-radius:15px;
}

.card-header{
    background:#0B3D91;
    color:white;
    font-size:24px;
    font-weight:bold;
}

.form-control,
.form-select{
    height:45px;
}

textarea{
    height:100px !important;
}

label{
    font-weight:600;
}

.btn{
    min-width:140px;
}

</style>

</head>

<body>

<div class="container my-5">

<div class="mb-3">
<a href="{% url 'index' %}" class="btn btn-secondary btn-sm">
<i class="fa-solid fa-arrow-left"></i> Back
</a>
</div>

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card shadow">

<div class="card-header text-center">

<i class="fa-solid fa-user-nurse"></i>

Field Worker Registration

</div>

<div class="card-body">

<form method="POST" onsubmit="return validateForm()">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input type="text"
id="full_name"
name="full_name"
class="form-control"
required>
<span class="text-danger small" id="fullNameError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Gender</label>

<select id="gender"
name="gender"
class="form-select"
required>

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>
<span class="text-danger small" id="genderError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Date of Birth</label>

<input type="date"
id="dob"
name="dob"
class="form-control"
required>
<span class="text-danger small" id="dobError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Phone Number</label>

<input type="tel"
id="phone"
name="phone"
class="form-control"
required
maxlength="10">
<span class="text-danger small" id="phoneError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input type="email"
id="email"
name="email"
class="form-control"
required>
<span class="text-danger small" id="emailError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Employee ID</label>

<input type="text"
id="employee_id"
name="employee_id"
class="form-control"
required
placeholder="FW001">
<span class="text-danger small" id="empIdError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Department</label>

<select id="department"
name="department"
class="form-select"
required>

<option value="">Select Department</option>

<option>Disease Surveillance</option>

<option>Public Health</option>

<option>Immunization</option>

<option>Emergency Response</option>

<option>Health Education</option>

</select>
<span class="text-danger small" id="deptError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Designation</label>

<select id="designation"
name="designation"
class="form-select"
required>

<option value="">Select Designation</option>

<option>Health Inspector</option>

<option>Junior Health Inspector</option>

<option>Public Health Nurse</option>

<option>Field Investigator</option>

<option>Community Health Worker</option>

</select>
<span class="text-danger small" id="desigError"></span>

</div>

<div class="col-md-6 mb-3">

<label>District</label>

<select id="district"
name="district"
class="form-select"
required>

<option value="">Select District</option>

<option>Thiruvananthapuram</option>
<option>Kollam</option>
<option>Pathanamthitta</option>
<option>Alappuzha</option>
<option>Kottayam</option>
<option>Idukki</option>
<option>Ernakulam</option>
<option>Thrissur</option>
<option>Palakkad</option>
<option>Malappuram</option>
<option>Kozhikode</option>
<option>Wayanad</option>
<option>Kannur</option>
<option>Kasaragod</option>

</select>
<span class="text-danger small" id="districtError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Panchayat</label>

<input type="text"
id="panchayat"
name="panchayat"
class="form-control"
required>
<span class="text-danger small" id="panchayatError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Ward</label>

<input type="number"
id="ward"
name="ward"
class="form-control"
required
min="1">
<span class="text-danger small" id="wardError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Qualification</label>

<input type="text"
id="qualification"
name="qualification"
class="form-control"
required>
<span class="text-danger small" id="qualError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Experience (Years)</label>

<input type="number"
id="experience"
name="experience"
class="form-control"
required
min="0"
max="40">
<span class="text-danger small" id="expError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Username</label>

<input type="text"
id="username"
name="username"
class="form-control"
required>
<span class="text-danger small" id="usernameError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Password</label>

<input
type="password"
id="password"
name="password"
class="form-control"
required>
<span class="text-danger small" id="passError"></span>

</div>

<div class="col-md-6 mb-3">

<label>Confirm Password</label>

<input
type="password"
id="confirm_password"
class="form-control"
required>
<span class="text-danger small" id="confirmPassError"></span>

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea
id="address"
name="address"
class="form-control"
required></textarea>
<span class="text-danger small" id="addressError"></span>

</div>

<div class="text-center">

<button type="submit"
class="btn btn-success">

<i class="fa-solid fa-user-plus"></i>

Register

</button>



</div>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script>

// Set DOB limits: age must be 18–60 for a field worker
(function setDobLimits(){
    const dob = document.getElementById("dob");
    const today = new Date();
    const maxDate = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());
    const minDate = new Date(today.getFullYear() - 60, today.getMonth(), today.getDate());
    dob.max = maxDate.toISOString().split("T")[0];
    dob.min = minDate.toISOString().split("T")[0];
})();

function validateForm(){

    let valid = true;

    // Clear all errors
    document.querySelectorAll(".text-danger").forEach(function(e){ e.innerHTML = ""; });


    // Full Name — letters and spaces, 3–50 chars
    let fullName = document.getElementById("full_name").value.trim();
    if(!/^[A-Za-z ]{3,50}$/.test(fullName)){
        document.getElementById("fullNameError").innerHTML = "Enter a valid name (3–50 letters only)";
        valid = false;
    }


    // Gender — must select
    if(document.getElementById("gender").value === ""){
        document.getElementById("genderError").innerHTML = "Please select a gender";
        valid = false;
    }


    // Date of Birth — must be within 18–60 years
    let dob = document.getElementById("dob").value;
    if(!dob){
        document.getElementById("dobError").innerHTML = "Date of Birth is required";
        valid = false;
    } else {
        const today = new Date();
        const birth = new Date(dob);
        const maxDate = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());
        const minDate = new Date(today.getFullYear() - 60, today.getMonth(), today.getDate());
        if(birth > maxDate){
            document.getElementById("dobError").innerHTML = "Must be at least 18 years old";
            valid = false;
        } else if(birth < minDate){
            document.getElementById("dobError").innerHTML = "Age cannot exceed 60 years";
            valid = false;
        }
    }


    // Phone — Indian mobile: starts with 6-9, exactly 10 digits
    let phone = document.getElementById("phone").value.trim();
    if(!/^[6-9][0-9]{9}$/.test(phone)){
        document.getElementById("phoneError").innerHTML = "Enter a valid 10-digit mobile number";
        valid = false;
    }


    // Email
    let email = document.getElementById("email").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        document.getElementById("emailError").innerHTML = "Enter a valid email address";
        valid = false;
    }


    // Employee ID — format: FW followed by 3 to 6 digits (e.g. FW001)
    let empId = document.getElementById("employee_id").value.trim();
    if(!/^FW[0-9]{3,6}$/.test(empId)){
        document.getElementById("empIdError").innerHTML = "Format: FW followed by 3–6 digits (e.g. FW001)";
        valid = false;
    }


    // Department — must select
    if(document.getElementById("department").value === ""){
        document.getElementById("deptError").innerHTML = "Please select a department";
        valid = false;
    }


    // Designation — must select
    if(document.getElementById("designation").value === ""){
        document.getElementById("desigError").innerHTML = "Please select a designation";
        valid = false;
    }


    // District — must select
    if(document.getElementById("district").value === ""){
        document.getElementById("districtError").innerHTML = "Please select a district";
        valid = false;
    }


    // Panchayat — letters, spaces, min 3 chars
    let panchayat = document.getElementById("panchayat").value.trim();
    if(panchayat.length < 3){
        document.getElementById("panchayatError").innerHTML = "Enter a valid panchayat name";
        valid = false;
    }


    // Ward — positive integer
    let ward = parseInt(document.getElementById("ward").value);
    if(isNaN(ward) || ward < 1){
        document.getElementById("wardError").innerHTML = "Ward number must be at least 1";
        valid = false;
    }


    // Qualification — min 3 chars
    let qual = document.getElementById("qualification").value.trim();
    if(qual.length < 3){
        document.getElementById("qualError").innerHTML = "Enter a valid qualification";
        valid = false;
    }


    // Experience — 0 to 40 years
    let exp = parseInt(document.getElementById("experience").value);
    if(isNaN(exp) || exp < 0 || exp > 40){
        document.getElementById("expError").innerHTML = "Experience must be between 0 and 40 years";
        valid = false;
    }


    // Username — 5 to 20 chars, alphanumeric and underscores only
    let username = document.getElementById("username").value.trim();
    if(!/^[A-Za-z0-9_]{5,20}$/.test(username)){
        document.getElementById("usernameError").innerHTML = "Username must be 5–20 characters (letters, numbers, underscore)";
        valid = false;
    }


    // Password — min 8 chars, uppercase, lowercase, number, special character
    let password = document.getElementById("password").value;
    if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/.test(password)){
        document.getElementById("passError").innerHTML = "Min 8 characters with uppercase, lowercase, number & special character";
        valid = false;
    }


    // Confirm Password — must match
    let confirmPass = document.getElementById("confirm_password").value;
    if(confirmPass !== password){
        document.getElementById("confirmPassError").innerHTML = "Passwords do not match";
        valid = false;
    }


    // Address — min 5 chars
    let address = document.getElementById("address").value.trim();
    if(address.length < 5){
        document.getElementById("addressError").innerHTML = "Please enter a valid address";
        valid = false;
    }


    return valid;

}

</script>

</body>

</html>
