<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .login-box{
            width:350px;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            color:#555;
            font-weight:bold;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
            transition:.3s;
        }

        .input-group input:focus{
            border-color:#4facfe;
            box-shadow:0 0 5px rgba(79,172,254,.5);
        }

        .btn{
            width:100%;
            padding:12px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
            transition:.3s;
        }

        .btn:hover{
            background:#008cff;
        }

        .register{
            text-align:center;
            margin-top:15px;
        }

        .register a{
            text-decoration:none;
            color:#4facfe;
            font-weight:bold;
        }

        .register a:hover{
            text-decoration:underline;
        }
    </style>

</head>
<body>

    <div style="position:fixed;top:15px;left:15px;">
        <a href="{% url 'index' %}" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
    </div>

    <div class="login-box">
        <h2>Login</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="register">
                <p>Don't have an account?
                    <a href="{% url 'registration' %}">Registr</a>
                </p>
            </div>

        </form>
    </div>

</body>
</html>
