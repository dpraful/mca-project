<!DOCTYPE html>
<html>
<head>

<title>Health Alerts</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">

<div class="mb-3">
<a href="{% url 'worker_home' %}" class="btn btn-secondary btn-sm">
<i class="fa-solid fa-arrow-left"></i> Back
</a>
</div>

<h2 class="mb-4">
📢 Health Alerts
</h2>



{% for alert in alerts %}


<div class="card mb-3 shadow">


<div class="card-body">


<h4>
{{alert.title}}
</h4>


<p>
<b>Type:</b>
{{alert.alert_type}}
</p>


<p>
{{alert.description}}
</p>


<p>
📍 {{alert.district}}
</p>


<small>
{{alert.created_at}}
</small>


</div>

</div>


{% empty %}


<div class="alert alert-info">

No alerts available

</div>


{% endfor %}



</div>


</body>
</html>
