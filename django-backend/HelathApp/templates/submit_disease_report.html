<!DOCTYPE html>
<html>

<head>

<title>Submit Disease Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
background:#eef3f8;
}

.card{
border:none;
border-radius:15px;
}

.card-header{
background:#0B3D91;
color:white;
font-size:24px;
font-weight:bold;
}

label{
font-weight:bold;
}

.form-control,
.form-select{
height:45px;
}

textarea{
height:120px !important;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-9">

<div class="card shadow">

<div class="card-header">

<i class="fa-solid fa-notes-medical"></i>

Submit Disease Case Report

</div>

<div class="card-body">
{% if messages %}
    {% for message in messages %}
        <script>
            alert("{{ message }}");
        </script>
    {% endfor %}
{% endif %}

<form method="POST" onsubmit="return validateForm();">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">

<label>Disease</label>

<select name="disease" class="form-select" required>

<option value="">Select Disease</option>

{% for d in diseases %}

<option value="{{ d.id }}">

{{ d.disease_name }}

</option>

{% endfor %}

</select>

</div>

<div class="col-md-6 mb-3">

<label>Region</label>

<select name="region" class="form-select" required>

<option value="">Select Region</option>

{% for r in regions %}

<option value="{{ r.id }}">

{{ r.region_name }}

</option>

{% endfor %}

</select>

</div>

<div class="col-md-3 mb-3">

<label>Total Cases</label>

<input
type="number"
name="case_count"
class="form-control"
 id="case_count"
min="1"
required>

</div>

<div class="col-md-3 mb-3">

<label>Male Cases</label>

<input
type="number"
name="male_cases"
class="form-control"
id="male_cases"                                 
min="0"
>

</div>

<div class="col-md-3 mb-3">

<label>Female Cases</label>

<input
type="number"
name="female_cases"
id="female_cases"
class="form-control"
min="0"
>

</div>

<div class="col-md-3 mb-3">

<label>Children Cases</label>

<input
type="number"
name="children_cases"
class="form-control"
id="children_cases"
min="0"
>

</div>

<div class="col-md-6 mb-3">

<label>Report Date</label>

<input type="date"
       name="report_date"
       id="report_date"
       max="{% now 'Y-m-d' %}"
       required>                                       

</div>

<div class="col-md-12 mb-3">

<label>Remarks</label>

<textarea
name="remarks"
class="form-control"></textarea>

</div>

<div class="text-center">

<button
class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Submit Report

</button>

<a
href="{% url 'hospital_home' %}"

class="btn btn-secondary">

Back

</a>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>
<script>
function validateForm() {

    let total = parseInt(document.getElementById("case_count").value) || 0;
    let male = parseInt(document.getElementById("male_cases").value) || 0;
    let female = parseInt(document.getElementById("female_cases").value) || 0;
    let children = parseInt(document.getElementById("children_cases").value) || 0;

    if (total !== (male + female + children)) {
        alert("Total cases must equal Male + Female + Children cases.");
        return false;
    }

    return true;
}
</script>          
</html>
